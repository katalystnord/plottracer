name: Build desktop binaries

# Produces the PlotTracer installers on each platform's own runner - the only way
# to get a real macOS .dmg / Windows .exe (they can't be cross-built on Linux).
# Run it by hand from the Actions tab (workflow_dispatch), or automatically when a
# version tag is pushed. On a tag push it also PUBLISHES a GitHub Release with the
# installers attached (the `release` job) so the website's Download links work; a
# hand run just leaves the artifacts on the run.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# A newer run for the same ref supersedes an in-flight one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚑ THE DURABLE HALF OF THE TYPECHECK GATE. Until v2.1.0 this workflow ran
  # `npm ci` and the packager and NOTHING else - no typecheck, no lint, no tests
  # - so a commit that did not compile could be built, tagged and PUBLISHED. It
  # nearly was: `vite build` strips types rather than checking them, exactly as
  # vitest does, so nothing in the pipeline would have said a word.
  # tools/git-hooks/pre-commit is the fast local half; this is the half that
  # survives a fresh clone and `git commit --no-verify`.
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # ⚑ The half that survives a fresh clone and `--no-verify`, for the style
      # rule as well as the types. See tools/no-em-dashes.sh for why it exists.
      - run: ./tools/no-em-dashes.sh
      - run: npm run typecheck
      - run: npm run lint

  # ⚑⚑ A SEPARATE JOB, AND THAT IS THE WHOLE POINT. This used to be the last
  # step of `check`, after lint - so on 2026-08-26 one unused variable exited 1
  # and the board did not execute in CI for a day, while the commit that
  # introduced the lint error asserted "lint 0 errors" in its own message. A
  # style failure must not be able to hide the state of the tests. Steps
  # fail-fast within a job; jobs do not, so as a job it always runs and both
  # verdicts are visible at once. `build` needs BOTH, so nothing ships past
  # either.
  #
  # ⚑⚑ UNTIL 2026-08-17 THIS PIPELINE NEVER RAN A TEST. A tag could be pushed,
  # built and PUBLISHED with the whole board unexecuted anywhere but the
  # maintainer's own machine. 3,900-odd tests in about a minute is the cheapest
  # gate this project has ever been offered - which is why it is worth making
  # sure it actually runs. See feedback_check_the_instrument_ran: a check that
  # never ran reports nothing, and nothing looks like success from a distance.
  #
  # ⚑ Unit only, and NOT because the rest does not matter: the e2e suites drive
  # a real Electron app on a virtual display and take ~22 minutes. Running them
  # here would trade a fast trustworthy gate for a slow flaky one. **So this
  # proves the pure layers, not the app** - his hands on the built package
  # remain the only instrument pointing outward, and the local `npm test`
  # remains the only one that drives the real thing.
  #
  # ⚑ The split is `vitest.unit.config.ts`, which excludes by the pattern
  # `*.e2e.test.ts` rather than by a list - and `e2eContainment.test.ts`
  # enforces that every Electron-launching file is named that way, so a new one
  # cannot escape the pattern the way it would escape a list.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  build:
    needs: [check, test]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            dist: linux
          - os: macos-latest
            name: macOS
            dist: mac
          - os: windows-latest
            name: Windows
            dist: win
    steps:
      - uses: actions/checkout@v4
        with:
          # The new app's build only needs ui/ + core/engine/algorithms + build/icons;
          # it never touches the wpd-core Git LFS assets, so skip LFS for speed.
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # ui:dist:<platform> runs ui:build then electron-builder for that OS
      # (build/electron-builder-ui.yml). mac/win are unsigned for now.
      - name: Build ${{ matrix.name }} installer
        run: npm run ui:dist:${{ matrix.dist }}
      - uses: actions/upload-artifact@v4
        with:
          name: plottracer-${{ matrix.dist }}
          path: |
            dist-ui/*.AppImage
            dist-ui/*.deb
            dist-ui/*.dmg
            dist-ui/*.zip
            dist-ui/*.exe
          if-no-files-found: error
          # ⚑ 1 day, not 14. These artifacts exist only to ferry the installers
          # from the three matrix jobs to the release job, which runs minutes later
          # in the same workflow. ARTIFACTS count against the account's storage
          # quota; RELEASE ASSETS on a public repo do not - so keeping ~500 MB of
          # them alive for a fortnight after they have already been attached to the
          # release was paying storage for a copy nobody reads. A hand-run
          # (workflow_dispatch) build publishes no release, so its artifacts are the
          # only output - one day is still enough to download them.
          retention-days: 1

  # On a version-tag push, gather every platform's installer and publish a public
  # GitHub Release with them attached - this is what the website's Download links
  # point at. A hand (workflow_dispatch) run skips this and just leaves artifacts.
  # A tag with a hyphen (v1.0.0-rc.3) is marked a pre-release; a clean tag (v1.0.0)
  # is a full release and becomes "Latest".
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for `body_path` below -- this job otherwise never checks out the
      # repo, so the notes file would not exist in its workspace and the page
      # would publish bare again, which is the defect it exists to fix.
      - uses: actions/checkout@v4
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # ⚑ THE RELEASE PAGE IS THE DOWNLOAD PAGE, and until v2.1 it carried
          # nothing but the auto-generated changelog link. Notes written into the
          # tag annotation are visible only to `git tag -n`; this action does not
          # read them, so v2.0.0, v2.0.1 and v2.0.2 all published BARE and had to
          # be backfilled by hand. It mattered most for v2.0.2, whose whole reason
          # to exist was to tell people their asymmetric error bars might be filed
          # against the wrong point -- a warning published nowhere.
          # `release-notes/<tag>.md` is now the source, and `generate_release_notes`
          # stays on because softprops APPENDS the changelog to a supplied body
          # rather than replacing it.
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
