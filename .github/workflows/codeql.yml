name: CodeQL

# A genuinely DIFFERENT engine from everything else in this repo.
#
# Stryker asks "would a change be noticed", ESLint asks "does this pattern look
# wrong", the review fleets ask a model to read. CodeQL does semantic DATAFLOW:
# it can follow a value from where it enters the program to where it is used,
# across files and functions. That is the one question none of the other
# instruments here can answer, and it is exactly the shape of this project's
# recurring defect — a value from a FILE reaching arithmetic without passing a
# guard (see the pie total that arrived as NaN and calibrated successfully).
#
# Free for public repositories. Results land in the Security tab.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so a finding from an updated ruleset surfaces without a push.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-and-quality adds the maintainability queries on top of the
          # default security set. This repo already has strong style tooling, so
          # the value here is the extra CORRECTNESS queries, not the style ones.
          queries: security-and-quality

      # No build step: CodeQL analyses TS/JS directly from source, and the
      # Electron packaging build would add ~3 minutes for nothing.
      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
