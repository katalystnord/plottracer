# electron-builder config for the (only) app -- runs via `npm start`
# (== `npm run ui:start`): ui/electron-main.cjs + ui/dist. Builds linux + mac
# (.dmg) + win (.exe) in CI (.github/workflows/build.yml).
#
# Historical note: this was once one of two builder configs during the
# strangler-fig migration; the old build/electron-builder.yml and the
# wpd-core/ui-patches app it packaged were deleted 2026-07-19. `extraMetadata.main`
# is now redundant with package.json's `main` (both ui/electron-main.cjs) -- kept
# harmlessly explicit.
appId: io.katalystnord.plottracer
productName: plottracer
executableName: plottracer
copyright: >
  PlotTracer is based on WebPlotDigitizer © Ankit Rohatgi (AGPL-3.0).
  Packaged by Katalyst Nord AB, Stockholm.

extraMetadata:
  main: ui/electron-main.cjs

icon: build/icons/512x512.png

# asar off, matching the old config -- keeps ui/dist's assets and the .cjs
# entry/preload as plain files so file:// loads and the BrowserWindow icon path
# resolve without asar-extraction surprises.
asar: false

electronLanguages:
  - en-US

directories:
  output: dist-ui
  buildResources: build

# Only the new app's files -- the built React bundle, the Electron entry +
# preload/ipc/menu, and the icons. The Help > Open example samples are already
# bundled into ui/dist by Vite, so samples/ isn't needed here.
files:
  - ui/dist/**/*
  # Glob the Electron entry/preload/ipc/menu/close-guard .cjs files so a newly
  # added one can't be forgotten (the old hand-maintained list was a drift trap
  # -- a missing file only surfaces as a runtime crash in the packaged app). The
  # DEV entry (electron-dev.cjs -- npm run ui:electron + the e2e harness) is NOT
  # shipped; package.json `main` is electron-main.cjs. Neither is
  # electron-start.cjs (v2.0 audit) -- an npm-script-only launcher that spawns
  # electron-main.cjs directly with the right platform flags; a packaged app
  # never goes through npm scripts, so it has nothing to spawn.
  - ui/electron-*.cjs
  # ⚑ The OCR models (v2.7): read by electron-ocr-worker.cjs from beside it.
  - ui/ocr-model/**/*
  # ⚑ The graph-type models (v2.7, Automatic graph extraction), with their LICENSE and NOTICE:
  # read by electron-figtype.cjs in the same worker.
  - ui/figtype-model/**/*
  - "!ui/electron-dev.cjs"
  - "!ui/electron-start.cjs"
  - build/icons/**/*
  - package.json
  # License + attribution text, shipped inside the app resources so the
  # binary is self-contained (AGPL/GPL conveying requirement; Apache-2.0
  # NOTICE propagation for the Ketcher-derived icons).
  - LICENSE
  - icons/LICENSE
  - icons/NOTICE
  - "!**/*.map"
  - "!**/node_modules/.bin"
  # ⚑⚑⚑ THE APP SHIPS ALMOST NO `node_modules`, AND THAT IS A 96MB SAVING.
  #
  # ⚠️ Until v2.4 this packaged **107MB** of `node_modules` that nothing could
  # reach: `@napi-rs` 32M, `@mui` 25M, `pdfjs-dist` 18M, `exceljs` 7.5M and the
  # rest. They are production `dependencies`, so electron-builder shipped them by
  # default, and nobody had asked what loads them.
  #
  # ▶ THE ANSWER IS NOTHING, and it is structural rather than a survey:
  #   · the RENDERER cannot reach them AT ALL. It runs `contextIsolation: true`
  #     and `nodeIntegration: false` over a `file://` document, so it has no
  #     `require` - every library it uses is inside Vite's bundle in `ui/dist`,
  #     including pdf.js's worker (`?worker`, whose own comment in
  #     ui/src/pdfRender.ts says "there is no runtime path to guess").
  #   · the MAIN process and the PRELOAD require, in total: `electron`, `path`,
  #     `fs`, `worker_threads`, `zlib`, each other, and `onnxruntime-web`. That is
  #     the whole list, and it is checkable by grepping `require(` across the
  #     shipped `.cjs` files.
  #
  # ⚑ So the rule is an ALLOW LIST: drop `node_modules`, then put back the OCR
  # engine and the handful of packages its NODE path actually loads. A deny list
  # would silently regrow the next time a dependency is added.
  #
  # ⚠️ THE RISK THIS CARRIES, said plainly: a missing transitive dependency shows
  # up ONLY in the packaged app, at the moment a feature is used. That is why
  # this change is not made on reasoning alone - the packaged binary is driven
  # (image open, PDF open, an export, and an OCR read) before it is believed.
  - "!node_modules/**/*"
  # ⚑⚑ OCR SHIPS ONE WASM BUILD AND THREE MODEL FILES (v2.7, PaddleOCR).
  # The reader is `onnxruntime-web` running PP-OCRv6 tiny (docs/v2.7-paddle-ocr.md).
  # In Node, `require('onnxruntime-web')` resolves to `dist/ort.node.min.js`, which
  # loads `onnxruntime-common`'s CommonJS build and ONE wasm build, the plain
  # threaded one, through its `.mjs` loader. Read off an strace of a real read
  # (2026-10-15), not off the package's file list: the other three wasm builds
  # (asyncify, jsep, jspi) are browser paths Node never takes, and they are 72MB.
  # ⚠️ As with Tesseract before it, only the packaged binary can confirm this
  # list: run `PACKAGED_APP=1 npx vitest run ui/__tests__/packagedApp.e2e.test.ts`.
  - node_modules/onnxruntime-web/package.json
  - node_modules/onnxruntime-web/dist/ort.node.min.js
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm
  - node_modules/onnxruntime-common/package.json
  - node_modules/onnxruntime-common/dist/cjs/**/*

linux:
  target:
    - AppImage
    - deb
  category: Science
  syncDesktopName: true
  synopsis: Extract quantitative data from scientific plot images
  description: >
    PlotTracer is an offline desktop tool for digitising data from
    scientific figures. Based on WebPlotDigitizer by Ankit Rohatgi,
    distributed under AGPL-3.0.
  artifactName: ${productName}_${version}_${arch}.${ext}
  maintainer: David Sandquist <david@katalystnord.com>
  vendor: Katalyst Nord AB

deb:
  packageCategory: science
  priority: optional
  afterInstall: build/postinst.sh

# macOS (built on a macos runner in CI -- can't be produced on Linux). Unsigned:
# no Apple Developer identity in CI, so `identity: null` skips code-signing and
# notarization (a first-launch Gatekeeper right-click-Open is the cost; signing is
# a later add once a cert exists). Icons are generated from build/icons/512x512.png.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  identity: null
  artifactName: ${productName}_${version}_${arch}.${ext}

# Windows (built on a windows runner in CI). Unsigned for now (SmartScreen warning
# on first run until a code-signing cert is added). NSIS installer that lets the
# user pick the install directory. Icon generated from the 512px png.
win:
  target:
    - nsis
  artifactName: ${productName}_${version}_${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# The --no-sandbox wrapper (AppImage) + chrome-sandbox perms (deb) the Linux
# build needs -- generic, keyed off the executable name, so shared with the old
# config unchanged.
afterPack: build/afterPack.js

publish: null
