# electron-builder config for the (only) app -- runs via `npm start`
# (== `npm run ui:start`): ui/electron-main.cjs + ui/dist. Builds linux + mac
# (.dmg) + win (.exe) in CI (.github/workflows/build.yml).
#
# Historical note: this was once one of two builder configs during the
# strangler-fig migration; the old build/electron-builder.yml and the
# wpd-core/ui-patches app it packaged were deleted 2026-07-19. `extraMetadata.main`
# is now redundant with package.json's `main` (both ui/electron-main.cjs) -- kept
# harmlessly explicit.
appId: io.katalystnord.plottracer
productName: plottracer
executableName: plottracer
copyright: >
  PlotTracer is based on WebPlotDigitizer © Ankit Rohatgi (AGPL-3.0).
  Packaged by Katalyst Nord AB, Stockholm.

extraMetadata:
  main: ui/electron-main.cjs

icon: build/icons/512x512.png

# asar off, matching the old config -- keeps ui/dist's assets and the .cjs
# entry/preload as plain files so file:// loads and the BrowserWindow icon path
# resolve without asar-extraction surprises.
asar: false

electronLanguages:
  - en-US

directories:
  output: dist-ui
  buildResources: build

# Only the new app's files -- the built React bundle, the Electron entry +
# preload/ipc/menu, and the icons. The Help > Open example samples are already
# bundled into ui/dist by Vite, so samples/ isn't needed here.
files:
  - ui/dist/**/*
  # Glob the Electron entry/preload/ipc/menu/close-guard .cjs files so a newly
  # added one can't be forgotten (the old hand-maintained list was a drift trap
  # -- a missing file only surfaces as a runtime crash in the packaged app). The
  # DEV entry (electron-dev.cjs -- npm run ui:electron + the e2e harness) is NOT
  # shipped; package.json `main` is electron-main.cjs. Neither is
  # electron-start.cjs (v2.0 audit) -- an npm-script-only launcher that spawns
  # electron-main.cjs directly with the right platform flags; a packaged app
  # never goes through npm scripts, so it has nothing to spawn.
  - ui/electron-*.cjs
  - "!ui/electron-dev.cjs"
  - "!ui/electron-start.cjs"
  - build/icons/**/*
  - package.json
  # License + attribution text, shipped inside the app resources so the
  # binary is self-contained (AGPL/GPL conveying requirement; Apache-2.0
  # NOTICE propagation for the Ketcher-derived icons).
  - LICENSE
  - icons/LICENSE
  - icons/NOTICE
  - "!**/*.map"
  - "!**/node_modules/.bin"
  # ⚑⚑⚑ THE APP SHIPS ALMOST NO `node_modules`, AND THAT IS A 96MB SAVING.
  #
  # ⚠️ Until v2.4 this packaged **107MB** of `node_modules` that nothing could
  # reach: `@napi-rs` 32M, `@mui` 25M, `pdfjs-dist` 18M, `exceljs` 7.5M and the
  # rest. They are production `dependencies`, so electron-builder shipped them by
  # default, and nobody had asked what loads them.
  #
  # ▶ THE ANSWER IS NOTHING, and it is structural rather than a survey:
  #   · the RENDERER cannot reach them AT ALL. It runs `contextIsolation: true`
  #     and `nodeIntegration: false` over a `file://` document, so it has no
  #     `require` - every library it uses is inside Vite's bundle in `ui/dist`,
  #     including pdf.js's worker (`?worker`, whose own comment in
  #     ui/src/pdfRender.ts says "there is no runtime path to guess").
  #   · the MAIN process and the PRELOAD require, in total: `electron`, `path`,
  #     `fs`, each other, and `tesseract.js`. That is the whole list, and it is
  #     checkable by grepping `require(` across the five shipped `.cjs` files.
  #
  # ⚑ So the rule is an ALLOW LIST: drop `node_modules`, then put back the OCR
  # engine and the handful of packages its NODE path actually loads. A deny list
  # would silently regrow the next time a dependency is added.
  #
  # ⚠️ THE RISK THIS CARRIES, said plainly: a missing transitive dependency shows
  # up ONLY in the packaged app, at the moment a feature is used. That is why
  # this change is not made on reasoning alone - the packaged binary is driven
  # (image open, PDF open, an export, and an OCR read) before it is believed.
  - "!node_modules/**/*"
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
  - node_modules/@tesseract.js-data/**/*
  # ⚠️⚑⚑ WHAT THE NODE PATH REQUIRES, READ OFF ITS OWN SOURCE - AND I GOT THIS
  # WRONG ONCE, WHICH IS WHY IT IS SPELLED OUT. The first attempt dropped
  # `bmp-js` as "browser only". It is not: `worker-script/utils/setImage.js` is
  # SHARED, so the node worker requires it, and the packaged app then failed
  # with `Cannot find module 'bmp-js'`.
  # ▶ The check that settles it is a grep for bare `require(` across
  # `node_modules/tesseract.js/src`, then asking WHICH FILE each one is in:
  # `zlibjs` (3.7MB) and `idb-keyval` appear only under `worker-script/browser/`,
  # which the node worker never loads (it uses built-in `zlib`), while `bmp-js`
  # sits in `worker-script/utils/`, which it always does.
  # ⚠️ AND A PLAIN `node` CHECK INSIDE THIS REPO CANNOT SETTLE IT: node resolves
  # up the directory tree, so a module missing from the package is found in the
  # repo's own `node_modules` and the test passes. Only the packaged binary
  # answers honestly - which is what `ui/__tests__/packagedApp.e2e.test.ts` is
  # for.
  - node_modules/bmp-js/**/*
  - node_modules/is-url/**/*
  - node_modules/wasm-feature-detect/**/*
  - node_modules/regenerator-runtime/**/*
  # ⚑ `node-fetch` and its three helpers are kept although they are almost
  # certainly dead: the call is `global.fetch || require('node-fetch')`, and
  # Electron's main process has `fetch`. 580KB against the chance that some
  # runtime one day does not is the right side of that trade, and unlike the
  # rest it is a `require` that would fire at OCR time.
  - node_modules/node-fetch/**/*
  - node_modules/whatwg-url/**/*
  - node_modules/tr46/**/*
  - node_modules/webidl-conversions/**/*

  # ⚑⚑ OCR SHIPS THREE ENGINE BUILDS, NOT SIX (v2.4). `tesseract.js-core` is
  # ~44MB: the same engine compiled six ways (plain / simd / relaxedsimd, each
  # with and without LSTM) plus a single-file `.wasm.js` copy of each with the
  # wasm inlined. The `.wasm.js` copies are never referenced by the loaders we
  # use, and half the builds are unreachable - see below.
  #
  # ⚠️⚠️ WHICH HALF IS UNREACHABLE WAS MEASURED, AND BOTH OF MY EARLIER ANSWERS
  # WERE WRONG. The v2.4 spike note said "ship `simd-lstm`". Then, having found
  # that Electron reports `relaxedSimd: true`, I shipped the two `*-lstm` SIMD
  # builds and asserted that OEM 1 (LSTM_ONLY) could reach nothing else. The
  # packaged app then failed with `Cannot find module
  # 'tesseract.js-core/tesseract-core-relaxedsimd'` - the NON-LSTM one.
  #
  # ▶ THE REASON IS A QUIRK IN tesseract.js 7.0.0, and it is worth writing down
  # because it makes the right answer certain rather than lucky.
  # `worker-script/index.js` calls `adapter.getCore(lstmOnly, corePath, res)`,
  # passing a BOOLEAN; `worker-script/node/getCore.js` receives it as `oem` and
  # branches on `[OEM.DEFAULT, OEM.LSTM_ONLY].includes(oem)` - that is
  # `[3, 1].includes(true)`, which is ALWAYS false. So the node worker takes the
  # non-LSTM branch whatever OEM the caller asks for, and the three builds it can
  # reach are exactly `relaxedsimd`, `simd` and plain, chosen by
  # `wasm-feature-detect`. All three are shipped: this machine loads
  # `relaxedsimd`, and the other two are the honest fallbacks for a CPU whose V8
  # answers differently.
  # ⚑ It costs ~10MB uncompressed against the 96MB this rule saves, and the
  # accuracy is unaffected: the non-LSTM core contains the LSTM engine too, it is
  # merely the larger build. Measured reading with it: 6 of 6 labels, confidence
  # 73-96.
  # ⚠️ If a later tesseract.js fixes that boolean, the `*-lstm` builds become the
  # reachable ones and this rule is wrong again - which is precisely what
  # `ui/__tests__/packagedApp.e2e.test.ts` exists to catch. Run it after a
  # package build; it is the only check that can see this class of fault.
  #
  # ⚑ These come AFTER the allow list above, because a later pattern wins.
  - "!node_modules/tesseract.js-core/*.wasm.js"
  - "!node_modules/tesseract.js-core/tesseract-core-lstm.*"
  - "!node_modules/tesseract.js-core/tesseract-core-simd-lstm.*"
  - "!node_modules/tesseract.js-core/tesseract-core-relaxedsimd-lstm.*"
  # ⚑ And ONE language set. `@tesseract.js-data/eng` carries both the 10.9MB
  # `4.0.0` data (which its own index.js points at) and the compact 2.95MB
  # `4.0.0_best_int`. We ask for the compact one by path in electron-ocr.cjs;
  # this is what stops the other one riding along.
  - "!node_modules/@tesseract.js-data/eng/4.0.0/**"

linux:
  target:
    - AppImage
    - deb
  category: Science
  syncDesktopName: true
  synopsis: Extract quantitative data from scientific plot images
  description: >
    PlotTracer is an offline desktop tool for digitising data from
    scientific figures. Based on WebPlotDigitizer by Ankit Rohatgi,
    distributed under AGPL-3.0.
  artifactName: ${productName}_${version}_${arch}.${ext}
  maintainer: David Sandquist <david@katalystnord.com>
  vendor: Katalyst Nord AB

deb:
  packageCategory: science
  priority: optional
  afterInstall: build/postinst.sh

# macOS (built on a macos runner in CI -- can't be produced on Linux). Unsigned:
# no Apple Developer identity in CI, so `identity: null` skips code-signing and
# notarization (a first-launch Gatekeeper right-click-Open is the cost; signing is
# a later add once a cert exists). Icons are generated from build/icons/512x512.png.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  identity: null
  artifactName: ${productName}_${version}_${arch}.${ext}

# Windows (built on a windows runner in CI). Unsigned for now (SmartScreen warning
# on first run until a code-signing cert is added). NSIS installer that lets the
# user pick the install directory. Icon generated from the 512px png.
win:
  target:
    - nsis
  artifactName: ${productName}_${version}_${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# The --no-sandbox wrapper (AppImage) + chrome-sandbox perms (deb) the Linux
# build needs -- generic, keyed off the executable name, so shared with the old
# config unchanged.
afterPack: build/afterPack.js

publish: null
